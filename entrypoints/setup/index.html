<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeadNav</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #e5e7eb;
        --accent: #2563eb;
        --ok: #16a34a;
        --error: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #f2f3f5;
          --muted: #9aa0a6;
          --line: #2a2d34;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main { max-width: 460px; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      h2 { font-size: 1.1rem; margin: 0 0 4px; }
      p { color: var(--muted); line-height: 1.5; }
      section { border-top: 1px solid var(--line); padding: 20px 0; }
      .optional { color: var(--muted); font-weight: 400; }
      button {
        margin-top: 8px;
        padding: 12px 22px;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      button:disabled { opacity: 0.5; cursor: default; filter: none; }
      h3 { font-size: 1rem; margin: 24px 0 10px; }
      .modes { display: grid; gap: 10px; text-align: left; }
      .mode {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 10px;
        row-gap: 4px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
      }
      .mode:has(input:checked) { border-color: var(--accent); }
      .mode input { grid-row: span 2; margin-top: 3px; }
      .modeTitle { font-weight: 600; }
      .modeText { color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
      .badge { margin-left: 6px; font-size: 0.75rem; color: var(--accent); }
      .status { margin-top: 14px; font-weight: 600; min-height: 1.4em; }
      .status.ok { color: var(--ok); }
      .status.error { color: var(--error); }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="setupHeading"></h1>
      <p data-i18n="setupIntro"></p>
      <section>
        <h2 data-i18n="setupCameraHeading"></h2>
        <p data-i18n="setupCameraText"></p>
        <button id="grantCamera" type="button" data-i18n="setupAllowCamera"></button>
        <div id="cameraStatus" class="status"></div>
      </section>
      <section>
        <h2><span data-i18n="setupMicrophoneHeading"></span> <span class="optional" data-i18n="setupOptional"></span></h2>
        <p data-i18n="setupMicrophoneText"></p>
        <button id="grantMicrophone" type="button" data-i18n="setupAllowMicrophone"></button>
        <div id="microphoneStatus" class="status"></div>

        <h3 data-i18n="setupVoiceHeading"></h3>
        <div class="modes">
          <label class="mode">
            <input type="radio" name="speechMode" value="online" />
            <span class="modeTitle"><span data-i18n="setupOnlineTitle"></span><span class="badge" data-i18n="setupRecommended"></span></span>
            <span class="modeText" data-i18n="setupOnlineText"></span>
          </label>
          <label class="mode">
            <input type="radio" name="speechMode" value="local" />
            <span class="modeTitle" data-i18n="setupLocalTitle"></span>
            <span class="modeText" data-i18n="setupLocalText"></span>
          </label>
        </div>
        <div id="localVoiceStatus" class="status"></div>
        <button id="installLocalVoice" type="button" data-i18n="setupInstallLocalVoice" disabled></button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
